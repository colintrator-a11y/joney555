<!doctype html>

    <!--
      Applies the saved theme before the first paint. Inline and synchronous on
      purpose: as a module it would run after the first paint and the page would
      flash the wrong theme on every visit. Light is the default in the tag
      above, so a first-time visitor still gets the intended ground.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch (e) {
          /* Private mode blocks storage; the light default in the tag stands. */
        }
      })()
    </script>

    <!--
      The loading screen. Inline and before the bundle on purpose: a React
      component cannot paint until the JavaScript it lives in has downloaded,
      which is the very wait this is covering. Pure CSS 3D — a cube turning in
      perspective — so it costs nothing to start.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #05080f;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }

      html[data-theme='light'] #boot { background: #fbf7fe; }

      #boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Everything is stacked in one cell, so the rings are centred on the
         mark without a single pixel of positioning maths. */
      .boot-stage {
        grid-area: 1 / 1;
        display: grid;
        place-items: center;
        width: min(78vmin, 560px);
        height: min(78vmin, 560px);
        perspective: 900px;
      }

      .boot-ring {
        grid-area: 1 / 1;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid rgba(61, 169, 252, 0.42);
        /* Each ring runs the same journey, started at a different point of
           it: one wave of rings leaving the mark, for ever. */
        animation: boot-ring 3.6s cubic-bezier(0.25, 0.6, 0.3, 1) infinite;
        opacity: 0;
      }

      html[data-theme='light'] .boot-ring { border-color: rgba(168, 85, 247, 0.42); }

      .boot-ring:nth-child(2) { animation-delay: 1.2s; }
      .boot-ring:nth-child(3) { animation-delay: 2.4s; }

      @keyframes boot-ring {
        0%   { transform: scale(0.18) rotateX(14deg); opacity: 0; }
        18%  { opacity: 0.85; }
        100% { transform: scale(1) rotateX(0deg); opacity: 0; }
      }

      .boot-mark {
        grid-area: 1 / 1;
        width: 86px;
        height: 86px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font: 600 38px/1 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
        color: #d6ecff;
        background: linear-gradient(160deg, #0d2440, #061427);
        border: 1px solid rgba(61, 169, 252, 0.55);
        box-shadow: 0 0 46px -6px rgba(61, 169, 252, 0.75),
          inset 0 0 26px -8px rgba(61, 169, 252, 0.9);
        animation: boot-breathe 2.6s ease-in-out infinite;
      }

      html[data-theme='light'] .boot-mark {
        color: #7c2fcb;
        background: linear-gradient(160deg, #ffffff, #f6e9ff);
        border-color: rgba(168, 85, 247, 0.5);
        box-shadow: 0 0 42px -10px rgba(168, 85, 247, 0.5);
      }

      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      .boot-text {
        grid-area: 1 / 1;
        align-self: end;
        margin-bottom: 11vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        font: 500 0.68rem/1 Inter, system-ui, sans-serif;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #51688c;
      }

      html[data-theme='light'] .boot-text { color: #8a7a9d; }

      .boot-track {
        width: 150px;
        height: 1px;
        background: rgba(61, 169, 252, 0.18);
        overflow: hidden;
      }

      /* Indeterminate: it reports that work is happening, and never claims a
         percentage it cannot know. */
      .boot-track i {
        display: block;
        width: 38%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #3da9fc, transparent);
        animation: boot-slide 1.4s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(300%); }
      }

      /* Movement off: the rings hold still at their full size and only the
         bar fades, so the screen still says "working". */
      @media (prefers-reduced-motion: reduce) {
        .boot-ring { animation: none; opacity: 0.4; }
        .boot-ring:nth-child(2) { transform: scale(0.66); }
        .boot-ring:nth-child(3) { transform: scale(0.33); }
        .boot-mark { animation: none; }
        .boot-track i { animation: boot-fade 1.6s ease-in-out infinite; width: 100%; }
        @keyframes boot-fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      }
    </style>
  </head>
  <body>

        <span class="boot-track" aria-hidden="true"><i></i></span>
