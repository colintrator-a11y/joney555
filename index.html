<!doctype html>
<html lang="en" data-theme="light">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f1" />

    <!--
      Applies the saved theme before the first paint. Inline and synchronous on
      purpose: as a module it would run after the first paint and the page would
      flash the wrong theme on every visit. Light is the default in the tag
      above, so a first-time visitor still gets the intended ground.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch (e) {
          /* Private mode blocks storage; the light default in the tag stands. */
        }
      })()
    </script>
