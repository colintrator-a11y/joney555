    <!--
      Applies the saved theme before the first paint. Inline and synchronous on
      purpose: as a module it would run after the first paint and the page would
      flash the wrong theme on every visit. Light is the default in the tag
      above, so a first-time visitor still gets the intended ground.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch (e) {
          /* Private mode blocks storage; the light default in the tag stands. */
        }
      })()
    </script>

    <!--
      The loading screen. Inline and before the bundle on purpose: a React
      component cannot paint until the JavaScript it lives in has downloaded,
      which is the very wait this is covering. Pure CSS 3D — a cube turning in
      perspective — so it costs nothing to start.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #05080f;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }

      html[data-theme='light'] #boot { background: #fbf7fe; }

      #boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-stage {
        grid-area: 1 / 1;
        display: grid;
        place-items: center;
        width: min(62vmin, 440px);
        height: min(62vmin, 440px);
      }

      .boot-web {
        grid-area: 1 / 1;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #3da9fc;
        stroke-width: 1;
        stroke-linecap: round;
      }

      html[data-theme='light'] .boot-web { stroke: #a855f7; }

      /*
       * The web spins itself: every thread is a dashed line whose single dash
       * is as long as the thread, so winding the offset back to zero draws it
       * from one end to the other. The spokes go out first, then the spirals
       * are laid from the middle outwards, which is the order a spider works
       * in. 600 is comfortably longer than the longest path here.
       */
      .boot-web path {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: boot-spin-thread 2.6s ease-out infinite;
      }

      .boot-web .spoke { opacity: 0.65; }
      .boot-web .spoke:nth-child(odd) { animation-delay: 0.05s; }

      .boot-web .ring { animation-delay: calc(0.5s + var(--ring) * 0.22s); }

      @keyframes boot-spin-thread {
        0% { stroke-dashoffset: 600; }
        38%, 86% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      /* The spider sits at the middle of the web it is spinning. */
      .boot-mark {
        grid-area: 1 / 1;
        width: min(30vmin, 150px);
        height: auto;
        filter: drop-shadow(0 0 26px rgba(61, 169, 252, 0.55));
        animation: boot-breathe 2.8s ease-in-out infinite;
      }

      /* Daylight only changes what it glows with: the artwork mattes cleanly
         now, so it needs nothing behind it. */
      html[data-theme='light'] .boot-mark {
        filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.45));
      }

      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      .boot-text {
        grid-area: 1 / 1;
        align-self: end;
        margin-bottom: 9vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        font: 500 0.68rem/1 Inter, system-ui, sans-serif;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #51688c;
      }

      html[data-theme='light'] .boot-text { color: #8a7a9d; }

      .boot-track {
        width: 150px;
        height: 1px;
        background: rgba(61, 169, 252, 0.18);
        overflow: hidden;
      }

      .boot-track i {
        display: block;
        width: 38%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #3da9fc, transparent);
        animation: boot-slide 1.4s ease-in-out infinite;
      }

      html[data-theme='light'] .boot-track i {
        background: linear-gradient(90deg, transparent, #a855f7, transparent);
      }

      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(300%); }
      }

      /* Movement off: the web is shown spun rather than spinning. */
      @media (prefers-reduced-motion: reduce) {
        .boot-web path { animation: none; stroke-dashoffset: 0; }
        .boot-mark { animation: none; }
        .boot-track i { animation: boot-fade 1.6s ease-in-out infinite; width: 100%; }
        @keyframes boot-fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      }
    </style>
  </head>
